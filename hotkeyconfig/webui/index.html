<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hotkeyconfig</title>
<style>
  :root{
    --bg:#16161a; --surface:#1e1e25; --surface2:#262630; --border:#33333d;
    --text:#e9e9ee; --muted:#9a9aa6; --accent:#7c6cf0; --accent-text:#fff;
    --ok:#22c55e; --err:#ef4444;
    --c-run:#8b7cf6; --c-open:#3b82f6; --c-text:#14b8a6; --c-media:#f59e0b;
    --c-native:#f59e0b; --c-hotkey:#ec4899; --c-window:#64748b; --c-sequence:#a855f7;
  }
  [data-theme="light"]{
    --bg:#f3f3f6; --surface:#ffffff; --surface2:#eeeef2; --border:#dedee4;
    --text:#1b1b20; --muted:#6b6b74; --accent:#6c5ce7; --accent-text:#fff;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden}
  .app{display:flex; flex-direction:column; height:100vh}
  header{display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-bottom:1px solid var(--border)}
  .brand{display:flex; align-items:center; gap:10px; font-size:16px; font-weight:600}
  .brand .logo{width:26px; height:26px; color:var(--accent)}
  .htools{display:flex; align-items:center; gap:10px}
  .pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:5px 11px; border-radius:999px; background:var(--surface2); color:var(--muted)}
  .pill.on{color:var(--ok)} .pill .dot{width:8px; height:8px; border-radius:50%; background:currentColor}
  .iconbtn{width:34px; height:34px; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:9px; cursor:pointer; display:flex; align-items:center; justify-content:center}
  .iconbtn:hover{background:var(--surface2)}
  .tabs{display:flex; gap:6px; padding:12px 18px 0}
  .tab{font-size:13px; padding:7px 16px; border-radius:9px 9px 0 0; color:var(--muted); cursor:pointer; border:1px solid transparent; border-bottom:none}
  .tab.active{background:var(--surface); color:var(--text); border-color:var(--border); font-weight:600}
  .body{flex:1; display:grid; grid-template-columns:1fr 320px; gap:16px; padding:16px 18px; min-height:0}
  .pad{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; overflow:auto}
  .knobs{display:flex; gap:16px; justify-content:center; margin-bottom:18px; flex-wrap:wrap}
  .knob{background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; align-items:center; gap:8px; min-width:150px}
  .knob .circle{width:54px; height:54px; border-radius:50%; border:3px solid var(--accent); display:flex; align-items:center; justify-content:center; color:var(--accent)}
  .knob .klabel{font-size:11px; color:var(--muted)}
  .chips{display:flex; gap:6px; width:100%}
  .chip{flex:1; font-size:11px; padding:6px 4px; border-radius:7px; background:var(--surface); border:1px solid var(--border); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted)}
  .chip:hover{border-color:var(--accent)} .chip.sel{border-color:var(--accent); color:var(--text)}
  .chip .cv{font-size:10px; color:var(--text); max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
  .key{aspect-ratio:1; border-radius:12px; background:var(--surface2); border:1px solid var(--border); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding:6px; transition:transform .05s}
  .key:hover{transform:translateY(-1px)} .key:active{transform:scale(.97)}
  .key.empty{border-style:dashed; color:var(--muted)}
  .key.sel{outline:2px solid var(--accent); outline-offset:1px}
  .key .kn{font-size:10px; color:var(--muted)} .key .ic{width:24px; height:24px}
  .key .kv{font-size:10px; max-width:90%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .editor{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; overflow:auto}
  .editor h3{font-size:12px; color:var(--muted); font-weight:500; text-transform:uppercase; letter-spacing:.04em}
  .editor .target{font-size:17px; font-weight:600; margin:2px 0 14px; display:flex; align-items:center; gap:8px}
  label{font-size:12px; color:var(--muted); display:block; margin:10px 0 4px}
  select,input{width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:9px; padding:9px 10px; font-size:13px; font-family:inherit}
  select:focus,input:focus{outline:none; border-color:var(--accent)}
  .hint{font-size:11px; color:var(--muted); margin-top:8px; line-height:1.5}
  .placeholder{color:var(--muted); font-size:13px; text-align:center; margin:auto; padding:20px}
  footer{display:flex; gap:10px; align-items:center; padding:12px 18px; border-top:1px solid var(--border)}
  .btn{display:inline-flex; align-items:center; gap:7px; font-size:13px; padding:9px 15px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; font-family:inherit}
  .btn:hover{background:var(--surface2)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-text)}
  .btn svg{width:17px; height:17px}
  .spacer{flex:1}
  .toast{position:absolute; bottom:64px; left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:9px 16px; border-radius:10px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none}
  .toast.show{opacity:1} .toast.err{border-color:var(--err); color:var(--err)} .toast.ok{border-color:var(--ok)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M7 12h10M6 16h12"/></svg>
      hotkeyconfig
    </div>
    <div class="htools">
      <span class="pill" id="devPill"><span class="dot"></span><span id="devTxt">…</span></span>
      <button class="iconbtn" id="themeBtn" title="Tema claro/oscuro" aria-label="Tema">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="body">
    <div class="pad">
      <div class="knobs" id="knobs"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="editor" id="editor">
      <div class="placeholder">Haz clic en una tecla o en una acción de perilla para configurarla.</div>
    </div>
  </div>
  <footer>
    <button class="btn primary" id="flashBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>Flashear teclado</button>
    <button class="btn" id="listenBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg><span>Iniciar listener</span></button>
    <div class="spacer"></div>
    <button class="btn" id="saveBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Guardar</button>
  </footer>
  <div class="toast" id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
