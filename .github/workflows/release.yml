name: Build and publish release

# Pushing a tag like v0.1.0 builds on Windows (.exe + installer), generates the
# checksums and publishes the release with its assets.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: ver
        run: |
          v=$(grep -oP '__version__ = "\K[^"]+' hotkeyconfig/__init__.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "App version: $v"
      - name: Check tag matches version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ -n "$tag" ] && [ "$tag" != "${{ steps.ver.outputs.version }}" ]; then
            echo "Tag ($tag) does not match __version__ (${{ steps.ver.outputs.version }})"
            exit 1
          fi

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build exe + installer
        run: python scripts/build.py --installer
      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\hotkeyconfig -DestinationPath dist\hotkeyconfig-windows.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/hotkeyconfig-${{ needs.version.outputs.version }}-setup.exe
            dist/hotkeyconfig-windows.zip

  release:
    needs: [version, build-windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets and checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          # Fixed name copy: gives a permanent download URL
          # (releases/latest/download/hotkeyconfig-setup.exe).
          cp "hotkeyconfig-${VERSION}-setup.exe" "hotkeyconfig-setup.exe"
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: hotkeyconfig ${{ env.VERSION }}
          generate_release_notes: true
          body: |
            ## Downloads (Windows 10/11)

            - `hotkeyconfig-${{ env.VERSION }}-setup.exe` (installer, recommended): wizard with shortcuts and uninstaller. No administrator needed.
            - `hotkeyconfig-windows.zip` (portable): unzip anywhere and run `hotkeyconfig.exe`.

            For ch57x macropads (for example `1189:8842`): it programs every key with a unique combo and binds the script or action you want to it. All local, no drivers.

            > **"Windows protected your PC"?** The app is not signed with a paid certificate, so SmartScreen may warn the first time. Click **More info** and then **Run anyway**.

            ---

            ## Descargas (Windows 10/11)

            - `hotkeyconfig-${{ env.VERSION }}-setup.exe` (instalador, recomendado): asistente con accesos directos y desinstalador. No necesita administrador.
            - `hotkeyconfig-windows.zip` (portable): descomprime donde quieras y ejecuta `hotkeyconfig.exe`.

            Para un macropad ch57x (p. ej. `1189:8842`): programa cada tecla con un combo unico y le cuelga el script o la accion que quieras. Todo local, sin drivers.

            > **"Windows protegio tu PC"?** La app no esta firmada con un certificado de pago, asi que SmartScreen puede avisar la primera vez. Pulsa **Mas informacion** y luego **Ejecutar de todas formas**.
          files: |
            dist/hotkeyconfig-${{ env.VERSION }}-setup.exe
            dist/hotkeyconfig-windows.zip
            dist/hotkeyconfig-setup.exe
            dist/SHA256SUMS.txt
