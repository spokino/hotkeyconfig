[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotkeyconfig"
version = "0.4.0"
description = "Programa macropads ch57x (1189:8842) y asigna scripts/atajos a cada tecla."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Munir Torres" }]
keywords = ["macropad", "ch57x", "hotkeys", "keyboard", "automation"]

# Dependencias mínimas, fijadas (>=), solo de PyPI oficial. Ver SECURITY.md.
# El flasheo va por HID nativo (hidapi): NO se necesita Rust ni ch57x-keyboard-tool.
dependencies = [
    "PyYAML>=6.0.1",
    "keyboard>=0.13.5",
    "pystray>=0.19.5",
    "Pillow>=10.3.0",
    "hidapi>=0.14.0",
    "pywebview>=5.0",
    'pywin32>=306; sys_platform == "win32"',
]

[project.optional-dependencies]
# Herramientas de desarrollo, auditoría y empaquetado.
dev = ["pip-audit>=2.7.0", "ruff>=0.5.0", "pyinstaller>=6.0"]

[project.scripts]
hotkeyconfig = "hotkeyconfig.cli:main"

[project.urls]
Homepage = "https://github.com/Mun1to/hotkeyconfig"
Issues = "https://github.com/Mun1to/hotkeyconfig/issues"

[tool.setuptools]
packages = ["hotkeyconfig"]

[tool.setuptools.package-data]
hotkeyconfig = ["webui/*.html", "webui/*.js", "webui/*.css"]

[tool.ruff]
line-length = 100
